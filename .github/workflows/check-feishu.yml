name: Check 表4 & md vs Feishu

# 只读对照，不写入飞书：
# - 表4：逐条对比（哪些编号不同、哪些字段不同；飞书多/少哪些编号）
# - md：只看有无（只在仓库 / 只在云盘 / 云盘重复），并检查「専攻」链接是否有效
# - 日期：「専攻」链接的 md 文件名日期 vs 表格「更新日期」（没有日期的单独列出）
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  FEISHU_APP_TOKEN: BQd7bdvsZaMV9OsvFElcbFGJnJf
  FEISHU_TABLE_ID: tblMgUcqdDIUC79g   # 东京理工塾协同系统 ·【学】大学院考学信息表
  LINK_FIELD: "専攻（点击详情）"        # md 链接所在的超链接字段
  FEISHU_FOLDER_TOKEN: OZmLfpbXcl7rfMdufbZctPhonIh
  FEISHU_DOMAIN: https://ccn3ynd15sp4.feishu.cn
  MD_ROOT: exam-monitor

jobs:
  check-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare 表4 with Feishu Bitable (read-only)
        env:
          CSV_PATH: 4_考学信息一览.csv
          DRY_RUN: "true"
        run: python scripts/sync_feishu.py

  check-md:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare exam-monitor md with Feishu Drive (existence only)
        run: python scripts/check_md.py

  check-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare md file-name dates with 更新日期 (read-only)
        run: python scripts/check_dates.py
      - name: Upload date report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-date-report
          path: sync-report/
          if-no-files-found: ignore
