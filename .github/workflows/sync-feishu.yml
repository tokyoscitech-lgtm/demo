name: Sync 表4 to Feishu

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-feishu.yml"
      - "4_考学信息一览.csv"
      - "exam-monitor/**/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览差异，不写入飞书（手动运行时才有这个选项）"
        type: boolean
        default: true
      md_commit:
        description: "md：比较哪个 commit 改动的文件（留空=当前分支最新一次 commit）"
        type: string
        default: ""
      md_paths:
        description: "md：另外指定要同步的文件，逗号分隔（如 exam-monitor/004大阪大学/.../004C-01物質創成専攻.md）"
        type: string
        default: ""
      all_rows:
        description: "处理全部记录（默认只处理这次改动涉及的编号；换表或需要整体对齐时勾选）"
        type: boolean
        default: false

concurrency:
  group: sync-feishu
  cancel-in-progress: false

permissions:
  contents: read

env:
  FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  FEISHU_APP_TOKEN: BQd7bdvsZaMV9OsvFElcbFGJnJf
  FEISHU_TABLE_ID: tblMgUcqdDIUC79g   # 东京理工塾协同系统 ·【学】大学院考学信息表
  LINK_FIELD: "専攻（点击详情）"        # md 链接所在的超链接字段
  FEISHU_FOLDER_TOKEN: OZmLfpbXcl7rfMdufbZctPhonIh
  FEISHU_DOMAIN: https://ccn3ynd15sp4.feishu.cn
  MD_ROOT: exam-monitor
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  # 每个阶段一个 job，左侧 Jobs 栏能看到进行到哪一步、哪一步失败
  detect:
    name: 1. 检测变更
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      compare_all: ${{ steps.flags.outputs.compare_all }}
      dry_run: ${{ steps.flags.outputs.dry_run }}
      scope_all: ${{ steps.flags.outputs.scope_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MD_COMMIT: ${{ inputs.md_commit }}
          MD_PATHS: ${{ inputs.md_paths }}
          ALL_ROWS: ${{ inputs.all_rows }}
        run: python scripts/sync_changes.py
      - name: Pass flags to later jobs
        id: flags
        run: |
          echo "compare_all=${MD_COMPARE_ALL:-false}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "scope_all=${SCOPE_ALL:-true}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: detect-files
          path: |
            changed_md.txt
            changed_keys.txt
            deleted_keys.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-1-detect
          path: sync-report/
          if-no-files-found: ignore

  table:
    name: 2. 同步表4 → 飞书
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ needs.detect.outputs.dry_run }}
      SCOPE_ALL: ${{ needs.detect.outputs.scope_all }}
      CHANGED_KEYS_LIST: changed_keys.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: detect-files
      - name: Sync 表4 to Feishu Bitable
        env:
          DELETED_KEYS_LIST: deleted_keys.txt
        run: python scripts/sync_feishu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-2-table
          path: sync-report/
          if-no-files-found: ignore

  md:
    name: 3. 同步 md 链接
    needs: [detect, table]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ needs.detect.outputs.dry_run }}
      MD_COMPARE_ALL: ${{ needs.detect.outputs.compare_all }}
      SCOPE_ALL: ${{ needs.detect.outputs.scope_all }}
      CHANGED_KEYS_LIST: changed_keys.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: detect-files
      - name: Sync MD and verify Feishu links
        env:
          MD_CHANGED_LIST: changed_md.txt
        run: python scripts/sync_md.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-3-md
          path: sync-report/
          if-no-files-found: ignore

  dates:
    name: 4. 日期核对（只读）
    needs: [detect, md]
    if: ${{ !cancelled() && needs.detect.result == 'success' }}   # md 同步失败也照样核对
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCOPE_ALL: ${{ needs.detect.outputs.scope_all }}
      CHANGED_KEYS_LIST: changed_keys.txt
      MD_CHANGED_LIST: changed_md.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: detect-files
      - name: Check md dates vs 更新日期
        run: python scripts/check_dates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-4-dates
          path: sync-report/
          if-no-files-found: ignore

  report:
    name: 5. 汇总报告
    needs: [detect, table, md, dates]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge reports into feishu-sync-report
        uses: actions/upload-artifact/merge@v4
        with:
          name: feishu-sync-report
          pattern: report-*
          delete-merged: true
